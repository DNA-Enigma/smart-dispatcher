# =============================================================================
# 流程模板：票据 → 账目
# =============================================================================
# 模板是具名、参数化、预先校验过的 DAG，用来固化"形状已知"的流程。
# 存在的理由：票据入账的形状是确定的，不应该每次请求都让 LLM 重新拆一遍——
# 那既费 token，又会在同一个形状上反复产生小幅幻觉（顺序变化、多加一个节点）。
#
# 模板是数据不是代码：新增一个模板 = 加一个 YAML 文件，调度层一行都不用改。
# 模板未命中率升高时，04 会提出 flow_template_add 建议。
#
# 模板由 handler 随附，因此在 07-handler-seam.md 的注册契约里声明。
# =============================================================================

template_id: receipt_to_entry
version: "2.0"
handler: bookkeeping

# 命中条件：由 03 拆解器判定。这里是给 LLM 读的散文，不是关键词列表。
applies_when: >
  输入中含有一张主要作为凭证的图像（票据、支付截图、账单、发票），
  且任务目的是从图中抽取金额等信息并记录为一笔往来。
  若图像只是顺带提供上下文而任务实质是回答问题，则不适用。
  若一次性上传多张互相独立的凭证，也不适用（应改用批量模板）。

applies_to_capabilities:
  - bookkeeping.expense.record
  - bookkeeping.income.record

inputs:
  - name: media_ref
    required: true
    description: 凭证图像的 media_id。
  - name: text_hint
    required: false
    description: 用户同时附带的文字，可能包含金额或用途的补充说明。
  - name: user_config
    required: true
    description: 该用户的记账配置（币种、分类词表、确认阈值）。

# -----------------------------------------------------------------------------
# 节点图。
#
# 每个节点声明 executor：
#   agent —— 带角色、带工具白名单、有界多轮循环的自主执行者。用于需要"先看到中间
#            结果再决定下一步"的步骤。角色定义见 config/agents.yaml。
#   tool  —— 单次确定性工具调用。用于输入确定则输出唯一、不需要中途调整策略的步骤。
#
# 这里刻意混用两种：抽取和归类需要判断与试探，查重和写库不需要。
# =============================================================================

nodes:
  # ---- agent：需要多轮。图糊了要能放大局部重看，字段散落要能分区域找。 ----
  - id: extract
    name: 抽取票据字段
    executor: agent
    role: receipt_extractor
    tool_whitelist: [extract_receipt_fields, crop_and_zoom, read_media_region]
    requires: [vision.extract, text]
    # `vision` 是模板专用的哨兵，不是档位名：意思是"用本次决策里的 vision_tier"。
    # 由 Decomposer._declared_tier 解析（它认不出真实档位名时一律给 None，不硬塞）。
    # 写清楚这点很重要——它曾经被当成一个不存在的档位名一路传下去，而升档的起点
    # 正是这个字段，于是"升档重试"升到了当前正在用的档位（2026-10-07 故障）。
    tier: vision
    max_rounds: 4
    on_round_limit: escalate_and_retry
    depends_on: []
    # 数据流绑定。$ref 的命名空间：envelope.*（原始请求）、<subtask_id>.*（上游产出）。
    # 少了这一段，节点会拿到一组空参数——任务照样"成功"，但写进去的东西是空的。
    inputs:
      media_ref: { $ref: "envelope.input.media[0].media_id" }
      text_hint: { $ref: "envelope.input.text" }
    output_schema_ref: bookkeeping.ReceiptFields
    # **单位是"每次 LLM 调用"，不是"每个节点"。** 这一点被误读过不止一次
    # （见 tests/test_node_timeout.py 与 docs/02-stages.md）：4 轮 agent 循环
    # 最坏可以跑 4×20000ms 而不超时——runner 里没有任何节点级墙钟。
    # 另外注意：真正贵的那次视觉调用发生在 extract_receipt_fields 工具内部，
    # 走的是全局默认超时（settings.llm_request_timeout_s），**不**受这里约束。
    # 所以这 20000 管的是 agent 自己的那几轮文本轮次，20s 是宽裕的。
    timeout_ms: 20000
    retry: { max: 1, backoff_ms: 500 }
    idempotent: true
    on_failure: fail_task
    # 默认关闭多 Agent 交叉验证。开启会让本步成本约乘 3，因此只有在该用户的
    # 人工改单率被 04 检测出长期偏高时，才值得对这一步打开 independent_review。
    # 记账的默认防线是下面 confirmation 段里的人工确认——比机器复核更准也更便宜。
    verification: null

  # ---- agent：归类需要结合用户历史习惯，且商户名常常不规范 ----
  - id: normalize
    name: 商户归类
    executor: agent
    role: merchant_classifier
    tool_whitelist: [lookup_merchant, query_ledger, list_categories]
    requires: [text]
    tier: cheap
    max_rounds: 3
    depends_on: [extract]
    inputs:
      merchant_raw: { $ref: "extract.merchant" }
    output_schema_ref: bookkeeping.Merchant
    timeout_ms: 8000
    idempotent: true
    on_failure: fail_task

  # ---- tool：输入是已定字段，输出唯一，没有任何可调整的余地 ----
  - id: dedupe
    name: 重复检查
    executor: tool
    tool: dedupe_check
    tier: null                      # 纯查表，不需要模型
    required_capabilities: []
    depends_on: [extract]
    inputs:
      fields: { $ref: "extract" }
      lookback_days: 3
    output_schema_ref: bookkeeping.DedupeResult
    timeout_ms: 3000
    optional: true
    idempotent: true
    on_failure: continue_with_default
    default_output: { duplicate: false, matched_entry_id: null }

  # ---- tool：写库 ----
  - id: write
    name: 生成待入账凭证
    executor: tool
    tool: build_ledger_entry
    tier: null
    required_capabilities: []
    depends_on: [normalize, dedupe]
    inputs:
      fields: { $ref: "extract" }
      merchant: { $ref: "normalize" }
      duplicate_checked: { $ref: "dedupe" }
    output_schema_ref: bookkeeping.LedgerEntry
    timeout_ms: 5000
    idempotent: true                # 调度层注入稳定的 idempotency_token，重试不会重复入账
    on_failure: fail_task

edges:
  - { from: extract, to: normalize }
  - { from: extract, to: dedupe }
  - { from: normalize, to: write }
  - { from: dedupe, to: write }

join:
  write: [normalize, dedupe]

max_parallelism: 3

# -----------------------------------------------------------------------------
# 人工确认：**这一段必须描述 handler 真正会抛的那次确认**。
#
# 模板的 `confirmation` 段不被任何代码执行——它没进拆解器提示词（模板只按
# template_id / applies_when / handler 三个字段喂给 LLM），也没进 runner。
# 它是"这一步之前会发生一次人工确认"的**可读表述**，同构的说明也写在
# schedule_parse_to_create.yaml 里。既然如此，它的正文只能来自**实现**：
# 真正改变行为的是 handlers/bookkeeping/handler.py 的 `tool_build_ledger_entry`，
# 它在 `direction` 不在 {expense, income} 内时返回 `ToolResult.confirm(...)`。
#
# 这里此前与实现分叉过：本段声明 confirm/edit/cancel，而 handler 返回 expense/income。
# 两处各写一份就一定会分叉，所以把真相归给 handler（被执行的那个），本段照它改写。
# tests/test_config_consistency.py 里有一条测试逐字比对两边的 option id——谁改了
# 一边而忘了另一边，测试会红。
#
# 为什么这次确认要紧：猜错方向等于把账记反（收入记成支出），而用户很难发现。
# 置信度那条（`requires_confirmation_below_confidence`）是**另一件事**：它是给拆解器
# LLM 的提示词指令（渲染见 dispatcher/core/prompts.py），不是运行时的强制确认，
# 因此不在这段的管辖内——这里不替它声明一次并不存在的确认。
# -----------------------------------------------------------------------------
confirmation:
  insert_before: write
  # 触发条件如实照抄 handler 的判定：不只是 null，**任何判不出的值**都算。
  on_condition: 'extract.direction not in {expense, income}'
  question_template: "这笔 {amount} {currency} 是支出还是收入？"
  options:
    - { id: expense, label: 支出 }
    - { id: income, label: 收入 }
  blocking: true
  # 答复后的分支：
  #   expense / income → 方向补齐，节点重跑一次并落成凭证；
  #   cancel           → 任务以 cancelled 结束。它由**调度层**处理
  #                      （ClarificationAnswer.is_cancel 认 answer_id == "cancel"），
  #                      因此不必出现在上面的 options 里也照样有效；
  #   要改字段          → 客户端把修改放进 clarify 的 edits（按节点 id 覆盖
  #                      extract 的产出），handler 的这次确认不提供 edit 选项。
  # 超时未答复按 blocking=false 处理：任务停在 awaiting_clarification，不自动入账。
  on_timeout: stay_pending
