# 依赖锁文件 —— 精确钉版，由 `pip freeze` 生成，勿手改。
#
# 生成方式（干净 venv，Python 3.12.3 / pip 24.0，与 .venv 同版本）：
#   python3 -m venv /tmp/lockgen
#   /tmp/lockgen/bin/pip install -e ".[dev]"
#   /tmp/lockgen/bin/pip freeze
#
# 安装方式（部署时照抄，详见 docs/12-deployment.md）：
#   python3 -m venv .venv
#   .venv/bin/pip install -r requirements.lock        # 全部第三方依赖，精确钉版
#   .venv/bin/pip install --no-deps -e .              # 本项目自身（editable）
#
# 两点刻意为之：
#  1. 本项目自身那一行被剔除。`pip freeze` 会把它渲染成
#     `-e git+https://github.com/...@<sha>`（pip 对"位于 git 工作区内的 editable 安装"
#     的渲染行为），那行依赖外网与本机 remote，换台机器不可复现。
#     本项目一律用上面的 `--no-deps -e .` 安装；`--no-deps` 是必需的，
#     否则 pip 会按 pyproject 的区间（>=）重新解析并可能升降级本文件里的钉版。
#  2. 本文件含 dev 依赖（pytest / ruff），因此服务器上也能直接跑测试。
#     代价是几 MB 磁盘，换来"线上环境与 CI 同一套包"，值得。
#
# 未加 --require-hashes：uvloop / httptools 等是本平台 wheel，写死哈希会让
# 换平台（如 x86 与 arm 互迁）直接装不上。需要哈希时再引入 pip-compile。

